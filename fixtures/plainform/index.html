<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Invoices — Plainform</title>
<style>
  :root {
    --canvas:#f5f4f1; --surface:#ffffff; --border:#d6d3cd; --ink:#1f2328;
    --ink-2:#59626b; --accent:#155eef; --accent-ink:#ffffff; --ok-bg:#e6f4ea; --ok-ink:#1e6b35;
  }
  @media (prefers-color-scheme: dark) {
    :root { --canvas:#16181c; --surface:#20242b; --border:#3a4048; --ink:#e8eaed;
            --ink-2:#a8b0b9; --accent:#7aa5ff; --accent-ink:#101318; --ok-bg:#1e3327; --ok-ink:#8fd6a5; }
  }
  * { margin:0; box-sizing:border-box; }
  body { font-family:-apple-system, "Segoe UI", Roboto, sans-serif; background:var(--canvas); color:var(--ink); }
  .wrap { max-width:640px; margin:0 auto; padding:0 20px; }
  header { background:var(--surface); border-bottom:1px solid var(--border); }
  header .wrap { display:flex; align-items:center; gap:12px; padding-top:14px; padding-bottom:14px; }
  h1 { font-size:17px; }
  main .wrap { padding-top:24px; padding-bottom:48px; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
  .btn { font-size:14px; border-radius:8px; padding:10px 16px; min-height:40px; cursor:pointer; }
  .btn-primary { background:var(--accent); color:var(--accent-ink); border:1px solid transparent; margin-left:auto; }
  .btn-quiet { background:none; border:1px solid var(--border); color:var(--ink); }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:18px; margin-top:16px; }
  .empty { text-align:center; padding:28px 18px; }
  .empty p { color:var(--ink-2); font-size:14px; margin-bottom:14px; }
  ul.invoices { list-style:none; }
  ul.invoices li { display:flex; align-items:center; gap:12px; padding:12px 4px; border-top:1px solid var(--border); font-size:14px; }
  ul.invoices li:first-child { border-top:none; }
  .status { font-size:12px; padding:3px 9px; border-radius:9px; background:var(--ok-bg); color:var(--ok-ink); }
  .status::before { content:"✓ "; }
  .due { color:var(--ink-2); font-size:13px; margin-left:auto; }
  dialog { border:1px solid var(--border); border-radius:12px; padding:22px; width:min(420px, 90vw);
           background:var(--surface); color:var(--ink); }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  dialog h2 { font-size:16px; margin-bottom:12px; }
  label { display:block; font-size:13px; margin-top:12px; margin-bottom:4px; }
  input { width:100%; font-size:14px; padding:9px 11px; border:1px solid var(--border);
          border-radius:8px; background:var(--canvas); color:var(--ink); }
  .hint { font-size:12px; color:var(--ink-2); margin-top:4px; }
  .error { font-size:13px; color:#b3261e; margin-top:4px; }
  @media (prefers-color-scheme: dark) { .error { color:#ffb4ab; } }
  .dlgbtns { display:flex; gap:10px; justify-content:flex-end; margin-top:18px; }
  .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--canvas);
           border-radius:8px; padding:10px 14px; font-size:14px; display:none; align-items:center; gap:12px; }
  .toast button { background:none; border:none; color:inherit; font-weight:600; font-size:14px; cursor:pointer;
                  text-decoration:underline; min-height:24px; min-width:44px; }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Plainform</h1>
    <button class="btn btn-primary" id="newbtn">New invoice</button>
  </div>
</header>
<main>
  <div class="wrap">
    <div class="card">
      <div class="empty" id="empty">
        <p>No invoices yet. Your first one takes about a minute.</p>
        <button class="btn btn-primary" id="emptybtn" style="margin:0 auto">Create your first invoice</button>
      </div>
      <ul class="invoices" id="list" hidden></ul>
    </div>
  </div>
</main>

<dialog id="dlg" aria-labelledby="dlgtitle">
  <h2 id="dlgtitle">New invoice</h2>
  <form method="dialog" id="form" novalidate>
    <label for="client">Client name</label>
    <input id="client" name="client" autocomplete="organization" required>
    <p class="error" id="clienterr" hidden>Enter the client's name — it appears on the invoice.</p>
    <label for="amount">Amount</label>
    <input id="amount" name="amount" inputmode="decimal" placeholder="0.00" required>
    <p class="hint">Due 30 days from today — you can change this later.</p>
    <p class="error" id="amounterr" hidden>Enter an amount, like 1250 or 1250.50.</p>
    <div class="dlgbtns">
      <button class="btn btn-quiet" type="button" id="cancel">Cancel</button>
      <button class="btn btn-primary" type="submit">Create invoice</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span id="toastmsg"></span>
  <button id="undo" hidden>Undo</button>
</div>

<script>
  const dlg = document.getElementById('dlg'), form = document.getElementById('form'),
        list = document.getElementById('list'), empty = document.getElementById('empty'),
        toast = document.getElementById('toast'), toastmsg = document.getElementById('toastmsg'),
        undoBtn = document.getElementById('undo');
  let invoices = [], lastDeleted = null, toastTimer = null, n = 0;

  function open() { form.reset(); hideErrors(); dlg.showModal(); document.getElementById('client').focus(); }
  document.getElementById('newbtn').onclick = open;
  document.getElementById('emptybtn').onclick = open;
  document.getElementById('cancel').onclick = () => dlg.close();

  function hideErrors(){ clienterr.hidden = amounterr.hidden = true; }
  form.onsubmit = (e) => {
    hideErrors();
    const client = form.client.value.trim(), amount = form.amount.value.trim();
    let bad = false;
    if (!client) { clienterr.hidden = false; bad = true; }
    if (!/^\d+(\.\d{1,2})?$/.test(amount)) { amounterr.hidden = false; bad = true; }
    if (bad) { e.preventDefault(); return; }
    invoices.push({ id: ++n, client, amount: Number(amount) });
    render();
    showToast(`Invoice ${n} created for ${client}.`, false);
  };

  function render() {
    empty.hidden = invoices.length > 0;
    list.hidden = invoices.length === 0;
    list.innerHTML = '';
    for (const inv of invoices) {
      const li = document.createElement('li');
      const due = new Date(Date.now() + 30*864e5).toLocaleDateString(undefined, {month:'short', day:'numeric'});
      li.innerHTML = `<span>#${inv.id} · ${inv.client}</span><span class="status">Draft</span>
        <span class="due">$${inv.amount.toFixed(2)} · due ${due}</span>
        <button class="btn btn-quiet" data-id="${inv.id}">Delete</button>`;
      li.querySelector('button').onclick = () => del(inv.id);
      list.appendChild(li);
    }
  }

  function del(id) {
    const i = invoices.findIndex(v => v.id === id);
    lastDeleted = { inv: invoices[i], at: i };
    invoices.splice(i, 1);
    render();
    showToast(`Deleted invoice #${id}.`, true);
  }

  undoBtn.onclick = () => {
    if (!lastDeleted) return;
    invoices.splice(lastDeleted.at, 0, lastDeleted.inv);
    lastDeleted = null; render(); hideToast();
  };

  function showToast(msg, canUndo) {
    toastmsg.textContent = msg; undoBtn.hidden = !canUndo;
    toast.style.display = 'flex';
    clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, 6000);
  }
  function hideToast(){ toast.style.display = 'none'; }
</script>
</body>
</html>
