<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings</title>
<style>
  * { margin:0; box-sizing:border-box; font-family:-apple-system, "Segoe UI", Roboto, sans-serif; }
  *:focus { outline: none; }
  body { background:#ffffff; color:#202124; }
  main { max-width:520px; margin:60px auto; padding:0 20px; }
  h1 { font-size:22px; }
  p { color:#9aa0a6; font-size:13px; margin-top:8px; }
  .row { margin-top:18px; font-size:14px; display:flex; justify-content:space-between; align-items:center; }
</style>
</head>
<body>
<main>
  <h1>Settings</h1>
  <p>Changes are saved automatically.</p>
  <div class="row"><span>Weekly digest</span><input type="checkbox" checked></div>
  <div class="row"><span>Sync telemetry</span><input type="checkbox" checked></div>
  <div class="row"><span>Beta features</span><input type="checkbox"></div>
</main>
</body>
</html>
