description = "Synthesise or reconcile a capability contract (pillars, roles, can/refuse/invisible/open cells)"
prompt = "Run manbun-contract for {{args}} (default: the current app). Use the manbun-contract skill: if no contract exists, synthesise one from the artifact — pillars with one-sentence promises and primary jobs, behavioural roles including the degenerate three, every cell filled, skeletons treated as declared intent with ideal-vs-today capability gaps, everything inferred marked for ratification. If a contract exists, reconcile it against the current state in both directions and re-present the open-question inbox. Offer the honesty-invariant check script."
